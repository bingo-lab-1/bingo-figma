name: 文档规范校验

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验文档规范
        run: python3 00-公共约定/校验.py
      # 全部页面迁移到 v3 后,把上一步换成:
      #   run: python3 00-公共约定/校验.py --strict
