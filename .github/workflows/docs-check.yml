name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Document structure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate current documents
        # Historical artifacts are audited separately with --include-artifacts.
        run: python3 00-公共约定/校验.py --strict
      - name: Test document selection
        run: python3 -m unittest discover -s 00-公共约定 -p 'test_validation.py'

  mermaid:
    name: Diagram syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
      - name: Parse every Mermaid diagram
        run: |
          set -euo pipefail
          npm i -g @mermaid-js/mermaid-cli@11 >/dev/null 2>&1
          mkdir -p /tmp/mmd
          # Chromium requires this configuration on the hosted runner.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/mmd/pptr.json
          # Use the same current-document selection as local validation.
          python3 - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, str(pathlib.Path("00-公共约定").resolve()))
          from doc_scope import find_documents
          base = pathlib.Path(".")
          n = 0
          idx = []
          documents, _ = find_documents(base)
          for f in documents:
              for m in re.finditer(r"```mermaid\n(.*?)```", f.read_text(encoding="utf-8"), re.S):
                  n += 1
                  p = f"/tmp/mmd/{n}.mmd"
                  pathlib.Path(p).write_text(m.group(1), encoding="utf-8")
                  idx.append(f"{n}\t{f.relative_to(base.resolve())}")
          pathlib.Path("/tmp/mmd/index.tsv").write_text("".join(row + "\n" for row in idx), encoding="utf-8")
          print(f"Extracted {n} diagrams")
          PY
          fail=0
          while IFS=$'\t' read -r num src; do
            if mmdc -p /tmp/mmd/pptr.json \
                    -i "/tmp/mmd/${num}.mmd" \
                    -o "/tmp/mmd/${num}.svg" >"/tmp/mmd/${num}.log" 2>&1; then
              continue
            fi
            # Report browser startup errors separately from diagram syntax errors.
            if rg -q "Failed to launch the browser" "/tmp/mmd/${num}.log"; then
              echo "::error::Mermaid browser startup failed"
              tail -10 "/tmp/mmd/${num}.log"
              exit 2
            fi
            echo "::error file=${src}::Invalid Mermaid syntax"
            sed -n '1,20p' "/tmp/mmd/${num}.log"
            fail=1
          done < /tmp/mmd/index.tsv
          [ "$fail" -eq 0 ] && echo "All Mermaid diagrams parsed successfully"
          exit $fail
