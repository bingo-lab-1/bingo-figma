name: 文档规范校验

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  spec:
    name: 文档结构
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验文档规范
        # 默认检查当前文档,历史归档另用 --include-artifacts 显式审计
        run: python3 00-公共约定/校验.py --strict
      - name: 校验范围回归检查
        run: python3 -m unittest discover -s 00-公共约定 -p 'test_validation.py'

  mermaid:
    name: 流程图语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 逐张解析 mermaid
        run: |
          set -euo pipefail
          npm i -g @mermaid-js/mermaid-cli@11 >/dev/null 2>&1
          mkdir -p /tmp/mmd
          # GitHub runner 上 Chromium 无可用 sandbox,需显式关闭
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/mmd/pptr.json
          # 与本地校验共用范围,只抽取当前文档的 mermaid 块
          python3 - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, str(pathlib.Path("00-公共约定").resolve()))
          from doc_scope import find_documents
          base = pathlib.Path(".")
          n = 0
          idx = []
          documents, _ = find_documents(base)
          for f in documents:
              for m in re.finditer(r"```mermaid\n(.*?)```", f.read_text(encoding="utf-8"), re.S):
                  n += 1
                  p = f"/tmp/mmd/{n}.mmd"
                  pathlib.Path(p).write_text(m.group(1), encoding="utf-8")
                  idx.append(f"{n}\t{f.relative_to(base.resolve())}")
          pathlib.Path("/tmp/mmd/index.tsv").write_text("".join(row + "\n" for row in idx), encoding="utf-8")
          print(f"抽出 {n} 张图")
          PY
          fail=0
          while IFS=$'\t' read -r num src; do
            if mmdc -p /tmp/mmd/pptr.json \
                    -i "/tmp/mmd/${num}.mmd" \
                    -o "/tmp/mmd/${num}.svg" >"/tmp/mmd/${num}.log" 2>&1; then
              continue
            fi
            # 区分环境失败与真正的语法错误,否则误导排查方向
            if grep -q "Failed to launch the browser" "/tmp/mmd/${num}.log"; then
              echo "::error::mermaid-cli 环境失败(浏览器无法启动),非文档问题"
              tail -10 "/tmp/mmd/${num}.log"
              exit 2
            fi
            echo "::error file=${src}::mermaid 语法错误"
            sed -n '1,20p' "/tmp/mmd/${num}.log"
            fail=1
          done < /tmp/mmd/index.tsv
          [ "$fail" -eq 0 ] && echo "全部 mermaid 图语法正确"
          exit $fail
