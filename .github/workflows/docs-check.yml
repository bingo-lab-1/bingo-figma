name: 文档规范校验

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  spec:
    name: 文档结构
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验文档规范
        # 已开工页面全部迁移到 v3,严格模式:未迁移即失败
        run: python3 00-公共约定/校验.py --strict

  mermaid:
    name: 流程图语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 逐张解析 mermaid
        run: |
          set -euo pipefail
          npm i -g @mermaid-js/mermaid-cli@11 >/dev/null 2>&1
          mkdir -p /tmp/mmd
          # GitHub runner 上 Chromium 无可用 sandbox,需显式关闭
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/mmd/pptr.json
          # 抽出每个 ```mermaid 块为独立文件
          python3 - <<'PY'
          import pathlib, re, os
          base = pathlib.Path(".")
          n = 0
          idx = []
          for f in sorted(base.rglob("*.md")):
              if ".git" in f.parts:
                  continue
              for m in re.finditer(r"```mermaid\n(.*?)```", f.read_text(encoding="utf-8"), re.S):
                  n += 1
                  p = f"/tmp/mmd/{n}.mmd"
                  pathlib.Path(p).write_text(m.group(1), encoding="utf-8")
                  idx.append(f"{n}\t{f}")
          pathlib.Path("/tmp/mmd/index.tsv").write_text("\n".join(idx), encoding="utf-8")
          print(f"抽出 {n} 张图")
          PY
          fail=0
          while IFS=$'\t' read -r num src; do
            if mmdc -p /tmp/mmd/pptr.json \
                    -i "/tmp/mmd/${num}.mmd" \
                    -o "/tmp/mmd/${num}.svg" >"/tmp/mmd/${num}.log" 2>&1; then
              continue
            fi
            # 区分环境失败与真正的语法错误,否则误导排查方向
            if grep -q "Failed to launch the browser" "/tmp/mmd/${num}.log"; then
              echo "::error::mermaid-cli 环境失败(浏览器无法启动),非文档问题"
              tail -10 "/tmp/mmd/${num}.log"
              exit 2
            fi
            echo "::error file=${src}::mermaid 语法错误"
            sed -n '1,20p' "/tmp/mmd/${num}.log"
            fail=1
          done < /tmp/mmd/index.tsv
          [ "$fail" -eq 0 ] && echo "全部 mermaid 图语法正确"
          exit $fail
