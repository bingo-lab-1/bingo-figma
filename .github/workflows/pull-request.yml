name: Pull request checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the squash commit title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const title = process.env.PR_TITLE;
            const convention = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\r\n()]+\))?!?: \S[^\r\n]*$/;
            if (!convention.test(title)) {
              core.setFailed('Use a Conventional Commit title, for example: feat(api): add account lookup');
            }
